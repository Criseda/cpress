<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="title desc">
<title id="title">enwik8, stage by stage</title>
<desc id="desc">Size of enwik8 after each codec: enwik8, as it is 100.0 MB; Stage 1: order0, one context 61.3 MB; Stage 2: mix6, six contexts mixed 22.5 MB; Stage 3: mix9, bit histories and a match model 19.7 MB.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="268" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" fill="#f0efec" font-weight="600">enwik8, stage by stage</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">The first 100 MB of English Wikipedia, after each stage's codec.</text>
<line x1="371.2" y1="78" x2="371.2" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="371.2" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">0</text>
<line x1="430.2" y1="78" x2="430.2" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="430.2" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">20</text>
<line x1="489.3" y1="78" x2="489.3" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="489.3" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">40</text>
<line x1="548.3" y1="78" x2="548.3" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="548.3" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">60</text>
<line x1="607.4" y1="78" x2="607.4" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="607.4" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">80</text>
<line x1="666.4" y1="78" x2="666.4" y2="212" stroke="#2c2c2a" stroke-width="1"/>
<text x="666.4" y="230" font-size="12" fill="#898781" text-anchor="middle" class="num">100</text>
<text x="371.2" y="250" font-size="12" fill="#898781">megabytes (millions of bytes)</text>
<text x="359.2" y="104.5" font-size="13" fill="#c3c2b7" text-anchor="end">enwik8, as it is</text>
<path d="M371.2 90H662.4A4 4 0 0 1 666.4 94V106A4 4 0 0 1 662.4 110H371.2Z" fill="#898781"/>
<text x="674.4" y="104.5" font-size="13" fill="#c3c2b7" class="num">100.0 MB</text>
<text x="359.2" y="136.5" font-size="13" fill="#c3c2b7" text-anchor="end">Stage 1: order0, one context</text>
<path d="M371.2 122H548.1A4 4 0 0 1 552.1 126V138A4 4 0 0 1 548.1 142H371.2Z" fill="#3987e5"/>
<text x="560.1" y="136.5" font-size="13" fill="#f0efec" font-weight="600" class="num">61.3 MB</text>
<text x="359.2" y="168.5" font-size="13" fill="#c3c2b7" text-anchor="end">Stage 2: mix6, six contexts mixed</text>
<path d="M371.2 154H433.7A4 4 0 0 1 437.7 158V170A4 4 0 0 1 433.7 174H371.2Z" fill="#3987e5"/>
<text x="445.7" y="168.5" font-size="13" fill="#f0efec" font-weight="600" class="num">22.5 MB</text>
<text x="359.2" y="200.5" font-size="13" fill="#c3c2b7" text-anchor="end">Stage 3: mix9, bit histories and a match model</text>
<path d="M371.2 186H425.3A4 4 0 0 1 429.3 190V202A4 4 0 0 1 425.3 206H371.2Z" fill="#3987e5"/>
<text x="437.3" y="200.5" font-size="13" fill="#f0efec" font-weight="600" class="num">19.7 MB</text>
<line x1="371.2" y1="78" x2="371.2" y2="212" stroke="#383835" stroke-width="1"/>
</svg>
