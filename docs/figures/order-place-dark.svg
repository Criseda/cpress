<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Naming an order by its place</title>
<desc id="desc">A table of six live orders in one stock. A delete message names an order by its 64-bit reference, about 23.6 bits a delete when coded as a column; cpress names it by its place in the list, about 4.5 bits on average, and then knows its side, shares and price.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="350" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" fill="#f0efec" font-weight="600">Naming an order by its place</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">Live orders in one stock, most recent first, as an example. A later message names one.</text>
<text x="44" y="108" font-size="12" fill="#898781" text-anchor="middle">Place</text>
<text x="76" y="108" font-size="12" fill="#898781">Reference</text>
<text x="206" y="108" font-size="12" fill="#898781">Side</text>
<text x="316" y="108" font-size="12" fill="#898781" text-anchor="end">Shares</text>
<text x="404" y="108" font-size="12" fill="#898781" text-anchor="end">Price</text>
<text x="44" y="138" font-size="13" fill="#c3c2b7" text-anchor="middle" class="num">1</text>
<text x="76" y="138" font-size="13" fill="#c3c2b7" class="num">7,385,104,951</text>
<text x="206" y="138" font-size="13" fill="#c3c2b7" class="num">buy</text>
<text x="316" y="138" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">100</text>
<text x="404" y="138" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">182.31</text>
<text x="44" y="166" font-size="13" fill="#c3c2b7" text-anchor="middle" class="num">2</text>
<text x="76" y="166" font-size="13" fill="#c3c2b7" class="num">7,385,104,630</text>
<text x="206" y="166" font-size="13" fill="#c3c2b7" class="num">sell</text>
<text x="316" y="166" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">200</text>
<text x="404" y="166" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">182.36</text>
<text x="44" y="194" font-size="13" fill="#c3c2b7" text-anchor="middle" class="num">3</text>
<text x="76" y="194" font-size="13" fill="#c3c2b7" class="num">7,385,104,412</text>
<text x="206" y="194" font-size="13" fill="#c3c2b7" class="num">buy</text>
<text x="316" y="194" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">50</text>
<text x="404" y="194" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">182.30</text>
<rect x="24" y="204" width="392" height="26" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="44" y="222" font-size="13" fill="#f0efec" text-anchor="middle" class="num">4</text>
<text x="76" y="222" font-size="13" fill="#f0efec" class="num">7,385,104,226</text>
<text x="206" y="222" font-size="13" fill="#f0efec" class="num">sell</text>
<text x="316" y="222" font-size="13" fill="#f0efec" text-anchor="end" class="num">100</text>
<text x="404" y="222" font-size="13" fill="#f0efec" text-anchor="end" class="num">182.37</text>
<text x="44" y="250" font-size="13" fill="#c3c2b7" text-anchor="middle" class="num">5</text>
<text x="76" y="250" font-size="13" fill="#c3c2b7" class="num">7,385,103,987</text>
<text x="206" y="250" font-size="13" fill="#c3c2b7" class="num">buy</text>
<text x="316" y="250" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">300</text>
<text x="404" y="250" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">182.29</text>
<text x="44" y="278" font-size="13" fill="#c3c2b7" text-anchor="middle" class="num">6</text>
<text x="76" y="278" font-size="13" fill="#c3c2b7" class="num">7,385,103,515</text>
<text x="206" y="278" font-size="13" fill="#c3c2b7" class="num">sell</text>
<text x="316" y="278" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">100</text>
<text x="404" y="278" font-size="13" fill="#c3c2b7" text-anchor="end" class="num">182.40</text>
<rect x="470" y="112" width="266" height="72" rx="6" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="482" y="132" font-size="12" fill="#898781">A delete, as sent</text>
<text x="482" y="155" font-size="13" fill="#c3c2b7" style="font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">delete 7,385,104,226</text>
<text x="482" y="174" font-size="12" fill="#898781">as a column: 23.6 bits a delete</text>
<rect x="470" y="204" width="266" height="72" rx="6" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="482" y="224" font-size="12" fill="#c3c2b7">The same delete, as coded</text>
<text x="482" y="247" font-size="13" fill="#f0efec" font-weight="600" style="font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace">delete place 4</text>
<text x="482" y="266" font-size="12" fill="#c3c2b7">4.5 bits on average</text>
<line x1="470" y1="240" x2="427.3" y2="220.3" stroke="#3987e5" stroke-width="1.5"/>
<path d="M420 217L428.9 216.7L425.6 224Z" fill="#3987e5"/>
<text x="24" y="322" font-size="12" fill="#c3c2b7">Once the order is found, its side, shares and price are known: a delete has nothing else to say.</text>
</svg>
