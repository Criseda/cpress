<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" viewBox="0 0 760 312" role="img" aria-labelledby="title desc">
<title id="title">Waiting for memory, and asking early</title>
<desc id="desc">Fetching when needed, each byte waits for memory before it is coded. Fetching a byte early, the entries for the next byte are requested while this one is coded, so the waits overlap the work and the same bytes finish sooner.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="312" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" fill="#f0efec" font-weight="600">Waiting for memory, and asking early</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">Not to scale. Coding a byte needs table entries that are mostly in main memory.</text>
<text x="24" y="124" font-size="12" fill="#f0efec">Fetching when needed</text>
<rect x="201" y="104" width="58" height="30" rx="4" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="230" y="124" font-size="12" fill="#898781" text-anchor="middle">wait</text>
<rect x="261" y="104" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="315" y="124" font-size="12" fill="#f0efec" text-anchor="middle">code byte 1</text>
<rect x="371" y="104" width="58" height="30" rx="4" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="400" y="124" font-size="12" fill="#898781" text-anchor="middle">wait</text>
<rect x="431" y="104" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="485" y="124" font-size="12" fill="#f0efec" text-anchor="middle">code byte 2</text>
<rect x="541" y="104" width="58" height="30" rx="4" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="570" y="124" font-size="12" fill="#898781" text-anchor="middle">wait</text>
<rect x="601" y="104" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="655" y="124" font-size="12" fill="#f0efec" text-anchor="middle">code byte 3</text>
<text x="24" y="200" font-size="12" fill="#f0efec">Fetching a byte early</text>
<rect x="201" y="180" width="58" height="30" rx="4" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="230" y="200" font-size="12" fill="#898781" text-anchor="middle">wait</text>
<rect x="261" y="180" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="315" y="200" font-size="12" fill="#f0efec" text-anchor="middle">code byte 1</text>
<rect x="266" y="216" width="98" height="8" rx="2" fill="#242423" stroke="#383835" stroke-width="1"/>
<rect x="371" y="180" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="425" y="200" font-size="12" fill="#f0efec" text-anchor="middle">code byte 2</text>
<rect x="376" y="216" width="98" height="8" rx="2" fill="#242423" stroke="#383835" stroke-width="1"/>
<rect x="481" y="180" width="108" height="30" rx="4" fill="#1c2f4a" stroke="#3987e5" stroke-width="1"/>
<text x="535" y="200" font-size="12" fill="#f0efec" text-anchor="middle">code byte 3</text>
<rect x="486" y="216" width="98" height="8" rx="2" fill="#242423" stroke="#383835" stroke-width="1"/>
<text x="266" y="240" font-size="12" fill="#898781">and meanwhile, fetch for the next byte</text>
<line x1="594" y1="195" x2="702" y2="195" stroke="#c3c2b7" stroke-width="1"/>
<path d="M710 195L702 199L702 191Z" fill="#c3c2b7"/>
<text x="650" y="176" font-size="12" fill="#c3c2b7" text-anchor="middle">time saved</text>
<line x1="200" y1="272" x2="728" y2="272" stroke="#383835" stroke-width="1"/>
<path d="M736 272L728 276L728 268Z" fill="#383835"/>
<text x="200" y="292" font-size="12" fill="#898781">time</text>
</svg>
