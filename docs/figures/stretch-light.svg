<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc">
<title id="title">Stretch: from probability to evidence</title>
<desc id="desc">The stretch of a probability against the probability: 0.5 stretches to 0, 0.9 to 2.2, 0.999 to 6.9, and 0.1 to -2.2. Near 0 and 1 a small step in probability is a large step in evidence.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="396" rx="8" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" fill="#0b0b0b" font-weight="600">Stretch: from probability to evidence</text>
<text x="24" y="56" font-size="13" fill="#52514e">stretch(p) = ln(p / (1 − p)). Evidence from separate models can be added; probabilities cannot.</text>
<line x1="68" y1="338" x2="728" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="342" font-size="12" fill="#898781" text-anchor="end" class="num">−8</text>
<line x1="68" y1="278" x2="728" y2="278" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="282" font-size="12" fill="#898781" text-anchor="end" class="num">−4</text>
<line x1="68" y1="218" x2="728" y2="218" stroke="#c3c2b7" stroke-width="1"/>
<text x="60" y="222" font-size="12" fill="#898781" text-anchor="end" class="num">0</text>
<line x1="68" y1="158" x2="728" y2="158" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="162" font-size="12" fill="#898781" text-anchor="end" class="num">+4</text>
<line x1="68" y1="98" x2="728" y2="98" stroke="#e1e0d9" stroke-width="1"/>
<text x="60" y="102" font-size="12" fill="#898781" text-anchor="end" class="num">+8</text>
<line x1="68" y1="98" x2="68" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="356" font-size="12" fill="#898781" text-anchor="middle" class="num">0</text>
<line x1="233" y1="98" x2="233" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="233" y="356" font-size="12" fill="#898781" text-anchor="middle" class="num">0.25</text>
<line x1="398" y1="98" x2="398" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="398" y="356" font-size="12" fill="#898781" text-anchor="middle" class="num">0.5</text>
<line x1="563" y1="98" x2="563" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="563" y="356" font-size="12" fill="#898781" text-anchor="middle" class="num">0.75</text>
<line x1="728" y1="98" x2="728" y2="338" stroke="#e1e0d9" stroke-width="1"/>
<text x="728" y="356" font-size="12" fill="#898781" text-anchor="middle" class="num">1</text>
<text x="68" y="376" font-size="12" fill="#898781">probability that the bit is a 1</text>
<text x="76" y="112" font-size="12" fill="#898781">evidence</text>
