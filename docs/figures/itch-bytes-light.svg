<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Where the bytes go: half of every message is its time</title>
<desc id="desc">Bits per message by field in the ITCH model over a whole day: Timestamp 16.33 bits, 53%; Stock, in order messages 3.52 bits, 11%; Stock, in adds 2.73 bits, 9%; The order's place in its stock's list 2.41 bits, 8%; Add: price 1.54 bits, 5%; Message type 1.51 bits, 5%; Add: shares 0.95 bits, 3%; Add: reference 0.93 bits, 3%; Add: side 0.38 bits, 1%; Everything else 0.77 bits, 2%.</desc>
