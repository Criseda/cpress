<text x="441.1" y="326" font-size="12" fill="#898781" text-anchor="middle" class="num">4</text>
<line x1="490.5" y1="78" x2="490.5" y2="308" stroke="#2c2c2a" stroke-width="1"/>
<text x="490.5" y="326" font-size="12" fill="#898781" text-anchor="middle" class="num">6</text>
