<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 760 364" role="img" aria-labelledby="title desc">
<title id="title">Understanding the data: bytes per ITCH message</title>
<desc id="desc">Bytes per message on the first 30,000,000 messages of the NASDAQ TotalView-ITCH 5.0 feed of 30 December 2019: cpress itch 3.93; columns, each zstd -19 (the fair baseline) 8.04; cpress mix9 8.12; xz -9 9.20; zstd --ultra -22 10.15; zstd -19 10.21; gzip -9 12.84. cpress mix9 sees bytes; cpress itch uses the same coder and mixer on the orders the messages describe.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="364" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" fill="#f0efec" font-weight="600">Understanding the data: bytes per ITCH message</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">The first 30 million messages of a NASDAQ trading day, 951 MB. Shorter is smaller.</text>
