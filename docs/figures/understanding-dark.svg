<text x="589.3" y="326" font-size="12" fill="#898781" text-anchor="middle" class="num">10</text>
<line x1="638.6" y1="78" x2="638.6" y2="308" stroke="#2c2c2a" stroke-width="1"/>
<text x="638.6" y="326" font-size="12" fill="#898781" text-anchor="middle" class="num">12</text>
