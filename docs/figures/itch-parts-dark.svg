<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">What each part of the ITCH model is worth</title>
<desc id="desc">Bytes per message of the ITCH model as parts are added: Every field in its contexts, every value as it is 6.967; + differences against the last 4.551; + the order table 3.905; + a new order's price as it is 3.875; + smaller history tables: the design 3.884.</desc>
<style>text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; } .num { font-variant-numeric: tabular-nums; }</style>
<rect width="760" height="300" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="17" fill="#f0efec" font-weight="600">What each part of the ITCH model is worth</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">A whole trading day, 268,744,780 messages; each row adds one thing to the row above.</text>
<line x1="392.8" y1="78" x2="392.8" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="392.8" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">0</text>
