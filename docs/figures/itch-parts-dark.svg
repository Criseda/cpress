<text x="435" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">1</text>
<line x1="477.1" y1="78" x2="477.1" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="477.1" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">2</text>
<line x1="519.3" y1="78" x2="519.3" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="519.3" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">3</text>
<line x1="561.5" y1="78" x2="561.5" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="561.5" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">4</text>
<line x1="603.7" y1="78" x2="603.7" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="603.7" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">5</text>
<line x1="645.8" y1="78" x2="645.8" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="645.8" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">6</text>
<line x1="688" y1="78" x2="688" y2="244" stroke="#2c2c2a" stroke-width="1"/>
<text x="688" y="262" font-size="12" fill="#898781" text-anchor="middle" class="num">7</text>
<text x="392.8" y="282" font-size="12" fill="#898781">bytes per message</text>
<text x="380.8" y="104.5" font-size="13" fill="#c3c2b7" text-anchor="end">Every field in its contexts, every value as it is</text>
<path d="M392.8 90H682.6A4 4 0 0 1 686.6 94V106A4 4 0 0 1 682.6 110H392.8Z" fill="#898781"/>
<text x="694.6" y="104.5" font-size="13" fill="#c3c2b7" class="num">6.967</text>
<text x="380.8" y="136.5" font-size="13" fill="#c3c2b7" text-anchor="end">+ differences against the last</text>
